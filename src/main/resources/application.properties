# Shared config for every profile — dev/prod properties files add the environment-specific bits
# (datasource credentials, logging).
spring.application.name=houseofbeauty
server.port=8091
spring.profiles.active=dev

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# The session AuthController's /login establishes and AuthenticationFilter checks on every /api/*
# request — an idle browser tab loses its session (and any unauthenticated API call starts 401ing)
# after this long. Deliberately shorter than the servlet container default (30m) since this is an
# internal tool, not a bank, but still generous enough that a user reading a long report doesn't
# get logged out mid-read.
server.servlet.session.timeout=60m

# Upload size cap — must stay above the largest expected CSV/XLSX import file.
spring.servlet.multipart.max-file-size=150MB
spring.servlet.multipart.max-request-size=150MB

# Gzip responses over 1KB — biggest single win for page-load speed: the Dashboard's own
# india-map.json alone is ~886KB uncompressed (JSON/JS/CSS/HTML compress 80-90%), and every
# REST endpoint's JSON benefits too. mime-types must be listed explicitly (Spring's own default
# list omits application/json).
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1KB

# Static assets (css/js/html under /static) change often during active development. max-age=1h
# previously let browsers skip the network (and any edit made in that window) entirely for up to an
# hour per URL — a real bug, not just a perf tradeoff: a page whose JS and HTML/CSS drift out of sync
# by even one cached-vs-fresh fetch can throw on since-added element ids. Tried no-cache (forces a
# conditional GET on every single request) as the fix, but that turned out to add real, measured
# latency: every one of the ~10 shared CSS/JS resources any page pulls in (Sidebar.css,
# QuickAccessPanel.js, etc.) went from an instant disk-cache hit to a ~150-200ms round trip, EVERY
# load. A short max-age is the actual right tradeoff: bounds staleness to a few seconds (imperceptible
# — nobody reloads a page within 30s of editing its source) while letting repeat loads within that
# window skip the network entirely again, same as before.
spring.web.resources.cache.cachecontrol.max-age=30s
spring.web.resources.cache.cachecontrol.must-revalidate=true

