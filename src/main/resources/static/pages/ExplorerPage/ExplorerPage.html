<!-- Explorer page: connection banner + table picker + data grid, wired up by ExplorerPage.js. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Explorer - IB Department</title>
    <script src="/Shared/js/auth-guard.js"></script>
    <script src="/Shared/js/sidebar-collapse-init.js"></script>
    <script src="/Shared/js/theme-init.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/Shared/css/variables.css">
    <link rel="stylesheet" href="/Shared/css/app.css">
    <link rel="stylesheet" href="/Shared/css/card.css">
    <link rel="stylesheet" href="/Shared/css/modal.css">
    <link rel="stylesheet" href="/components/Sidebar/Sidebar.css">
    <link rel="stylesheet" href="/components/TableList/TableList.css">
    <link rel="stylesheet" href="/components/QuickAccessPanel/QuickAccessPanel.css">
    <link rel="stylesheet" href="/pages/ExplorerPage/ExplorerPage.css">
</head>
<body>
    <div class="app-shell">
        <nav class="app-sidebar" id="appSidebar"></nav>
        <script src="/components/Sidebar/SidebarBootstrap.js"></script>
        <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
        <button type="button" class="sidebar-toggle-btn" id="sidebarToggle" aria-label="Open menu" aria-expanded="false" title="Menu">
            <i class="bi bi-list"></i>
        </button>

        <main class="app-main">
            <div class="explorer-page-header">
                <span class="db-connection-status" id="dbConnectionStatus">
                    <span class="status-dot"></span>
                    <span class="status-text">Checking…</span>
                </span>
            </div>

            <section class="explorer-sections" id="explorerSections">
            <div class="section-container table-list-section" id="tableListSection" data-permission="page:explorer.tables" hidden>
            <div class="section-header">
                <h2 class="section-title">Tables</h2>
            </div>

            <div class="section-content">
                <div class="table-list-columns">
                    <div class="table-list-grid" id="tableListGrid">
                        <span class="table-list-status">Loading tables…</span>
                    </div>
                    <div class="table-info-panel" id="tableInfoPanel"></div>
                </div>
            </div>
            </div>

            <div class="section-container" id="tableDataSection" data-permission="page:explorer.table-data" hidden>
            <div class="section-header">
                <div class="table-data-header">
                    <h2 class="section-title" id="tableDataTitle">Table Data</h2>
                    <div class="table-data-header-actions">
                        <div class="table-data-search">
                            <i class="bi bi-search"></i>
                            <input type="text" id="tableDataSearch" placeholder="Search…" disabled data-feature="feature:search-bar">
                        </div>
                        <div class="table-data-download" data-feature="feature:excel-download">
                            <button type="button" class="table-data-download-btn" id="tableDataDownloadBtn" disabled>
                                <i class="bi bi-download"></i> Download
                            </button>
                            <div class="table-data-download-panel" id="tableDataDownloadPanel" hidden>
                                <div class="download-panel-group">
                                    <span class="download-panel-label">Format</span>
                                    <div class="download-panel-options">
                                        <label><input type="radio" name="downloadFormat" value="csv" checked> CSV</label>
                                        <label><input type="radio" name="downloadFormat" value="xlsx"> XLSX</label>
                                    </div>
                                </div>
                                <div class="download-panel-group">
                                    <span class="download-panel-label">Rows</span>
                                    <div class="download-panel-options">
                                        <label><input type="radio" name="downloadScope" value="range" checked> Row range</label>
                                        <label class="download-panel-date-option" id="downloadScopeDateLabel">
                                            <input type="radio" name="downloadScope" value="date" id="downloadScopeDate" disabled>
                                            <span>Date range</span>
                                            <span class="download-panel-hint" id="downloadScopeDateHint">no date column</span>
                                        </label>
                                    </div>
                                </div>
                                <div class="download-panel-range" id="downloadRangeInputs" hidden>
                                    <label>From <input type="number" min="1" id="downloadRangeStart" value="1"></label>
                                    <label>To <input type="number" min="1" id="downloadRangeEnd"></label>
                                </div>
                                <div class="download-panel-group" id="downloadDateInputs" hidden>
                                    <div class="download-panel-group" id="downloadDateColumnGroup" hidden>
                                        <span class="download-panel-label">Date Column</span>
                                        <select class="download-panel-select" id="downloadDateColumnSelect"></select>
                                    </div>
                                    <div class="download-panel-date-single-hint" id="downloadDateSingleHint" hidden></div>
                                    <div class="download-panel-range download-panel-range-stacked">
                                        <label>From <input type="date" id="downloadDateFrom"></label>
                                        <label>To <input type="date" id="downloadDateTo"></label>
                                    </div>
                                    <p class="download-panel-error" id="downloadDateError" hidden></p>
                                </div>
                                <button type="button" class="download-panel-submit" id="downloadSubmitBtn">
                                    <i class="bi bi-download"></i> Download
                                </button>
                            </div>
                        </div>
                        <div class="table-data-menu">
                            <button type="button" class="table-data-menu-btn" id="tableDataMenuBtn" disabled title="More options">
                                <i class="bi bi-three-dots-vertical"></i>
                            </button>
                            <div class="table-data-menu-panel" id="tableDataMenuPanel" hidden>
                                <button type="button" class="menu-panel-item" id="menuEditBtn" disabled data-feature="feature:edit-row">
                                    <i class="bi bi-pencil-square"></i> <span id="menuEditBtnLabel">Edit Rows</span>
                                </button>
                                <button type="button" class="menu-panel-item" id="menuTemplateBtn" data-feature="feature:template-download">
                                    <i class="bi bi-file-earmark-arrow-down"></i> Sample Template
                                </button>
                            </div>
                        </div>
                        <button type="button" class="table-data-refresh-btn" id="tableDataRefreshBtn" disabled title="Refresh">
                            <i class="bi bi-arrow-clockwise"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="section-content">
                <div class="table-data-message" id="tableDataMessage"></div>
                <div class="table-data-card">
                    <div class="table-data-scroll" id="tableDataScroll">
                        <table class="table-data-table">
                            <thead id="tableDataHead"></thead>
                            <tbody id="tableDataBody">
                                <tr>
                                    <td class="table-data-empty">Select a table above to view its data.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="table-data-pagination" id="tableDataPagination"></div>
                </div>
            </div>
            </div>
            </section>

        </main>
    </div>

    <div class="quick-access-panel" id="quickAccessPanel"></div>

    <script type="module" src="/pages/ExplorerPage/ExplorerPage.js"></script>
</body>
</html>
