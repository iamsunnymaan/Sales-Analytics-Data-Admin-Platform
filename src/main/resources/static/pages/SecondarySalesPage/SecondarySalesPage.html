<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Secondary Sales - IB Department</title>
    <script src="/Shared/js/auth-guard.js"></script>
    <script src="/Shared/js/sidebar-collapse-init.js"></script>
    <script src="/Shared/js/theme-init.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/Shared/css/variables.css">
    <link rel="stylesheet" href="/Shared/css/app.css">
    <link rel="stylesheet" href="/Shared/css/card.css">
    <link rel="stylesheet" href="/Shared/css/modal.css">
    <link rel="stylesheet" href="/components/Sidebar/Sidebar.css">
    <link rel="stylesheet" href="/components/QuickAccessPanel/QuickAccessPanel.css">
    <link rel="stylesheet" href="/components/ExcelDownloadButton/ExcelDownloadButton.css">
    <link rel="stylesheet" href="/components/StatusFilter/StatusFilter.css">
    <link rel="stylesheet" href="/pages/SecondarySalesPage/SecondarySalesPage.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
</head>
<body>
    <div class="app-shell">
        <nav class="app-sidebar" id="appSidebar"></nav>
        <script src="/components/Sidebar/SidebarBootstrap.js"></script>
        <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
        <button type="button" class="sidebar-toggle-btn" id="sidebarToggle" aria-label="Open menu" aria-expanded="false" title="Menu">
            <i class="bi bi-list"></i>
        </button>

        <main class="app-main">
            <section class="secondary-sections" id="secondarySections">

            <div class="section-container" id="dashboardFyOverviewFilterHeaderSectionContainer">
            <div class="section-header">
                <div class="secondary-overview-title-row">
                    <p class="secondary-overview-subtitle">Filter Header</p>

                    <span class="ta-overview-range-label" id="taOverviewRangeLabel"></span>
                </div>
            </div>

            <div class="section-content">
                <div class="dashboard-fy-overview-filter-header-card">
                    <div class="dashboard-fy-overview-filter-row" id="dashboardFyOverviewFilterRow">
                        <div class="dashboard-fy-overview-field">
                            <span class="dashboard-fy-overview-label">Brand</span>
                            <div class="brand-header-pill" id="dashboardFyOverviewBrandToggle" data-feature="feature:brand-filter">

                                <span class="brand-header-item brand-header-loading">Loading…</span>
                            </div>
                        </div>
                        <div class="dashboard-fy-overview-field">
                            <span class="dashboard-fy-overview-label">Channel</span>
                            <div class="brand-header-pill" id="dashboardFyOverviewChannelToggle" data-feature="feature:channel-filter">

                                <span class="brand-header-item brand-header-loading">Loading…</span>
                            </div>
                        </div>

                        <div class="site-status-card-field site-status-filter-field">
                            <span class="site-status-card-label">Status</span>
                            <div class="site-status-filter-pill" id="dashboardFyOverviewStatusToggle" data-feature="feature:status-filter">

                                <span class="site-status-filter-item brand-header-loading">Loading…</span>
                            </div>
                        </div>

                        <div class="secondary-overview-header-right" data-feature="feature:date-filter">
                            <div class="daily-trend-filter-cluster">
                                <div class="sales-date-filter" id="overviewDateFilter">
                                    <div class="sales-date-filter-mode-toggle" id="overviewDateFilterModeToggle">
                                        <button type="button" class="sales-date-filter-mode-btn" data-mode="filter"><i class="bi bi-funnel"></i> Filter</button>
                                    </div>
                                </div>

                                <div class="sales-date-filter-body" id="overviewDateFilterBody"></div>
                                <button type="button" class="sales-date-filter-clear" id="overviewDateFilterClearBtn" title="Clear date filter">
                                    <i class="bi bi-x-circle"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            </div>

            <div class="section-container" id="secondaryOverviewSection" data-permission="page:secondary-sales.overview" hidden>
            <div class="section-header">
                <div class="secondary-overview-title-row">
                    <div class="secondary-overview-subtitle-group">
                        <p class="secondary-overview-subtitle">1. Overview</p>

                        <span class="section-loading-spinner" id="overviewSpinner" aria-hidden="true"></span>
                    </div>
                </div>
            </div>

            <div class="section-content">
                <div class="secondary-overview-card">
                    <div class="secondary-overview-table-wrap scroll-hidden" id="secondaryOverviewTableWrap">

                    </div>
                </div>
            </div>
            </div>

            <div class="section-container" id="dailyTrendSectionContainer" data-permission="page:secondary-sales.daily-trends" hidden>
            <div class="section-header">
            <p class="secondary-overview-subtitle">2. Daily Sales Trends</p>
            </div>

            <div class="section-content">
            <div class="daily-trend-card" id="dailyTrendCard">
                <div class="daily-trend-header">
                    <div class="daily-trend-header-text">
                        <span class="daily-trend-title">Sales Trend</span>
                        <span class="daily-trend-mode-badge" id="dailyTrendModeBadge">—</span>
                    </div>
                    <div class="daily-trend-header-actions">

                        <button type="button" class="daily-trend-compare-toggle active" id="dailyTrendTargetToggle" aria-pressed="true" title="Overlay Sales Target for the same period">
                            <i class="bi bi-bullseye"></i> Target
                        </button>

                        <button type="button" class="daily-trend-compare-toggle" id="dailyTrendVsLastYearToggle" aria-pressed="false" title="Overlay last year's Sales for the same period">
                            <i class="bi bi-calendar2-week"></i> Vs Last Year
                        </button>
                        <button type="button" class="daily-trend-compare-toggle" id="dailyTrendCompareToggle" aria-pressed="false" title="Compare brands side by side">
                            <i class="bi bi-bar-chart-steps"></i> Compare
                        </button>
                        <div class="daily-trend-chart-type-toggle" id="dailyTrendChartTypeToggle">
                            <button type="button" class="daily-trend-chart-type-btn active" data-chart-type="line">Graph</button>
                            <button type="button" class="daily-trend-chart-type-btn" data-chart-type="bar">Bar Graph</button>
                        </div>
                    </div>
                </div>

                <div class="daily-trend-selection-summary" id="dailyTrendSelectionSummary">—</div>

                <div class="daily-trend-chart-scroll" id="dailyTrendChartScroll">
                    <div class="daily-trend-chart" id="dailyTrendChart"></div>
                </div>
            </div>
            </div>
            </div>

            <div class="section-container" id="secondaryProductSnapshotSectionContainer" data-permission="page:secondary-sales.product-snapshot" hidden>
            <div class="section-header">
            <p class="secondary-overview-subtitle">3. Product Snapshot</p>
            </div>

            <div class="section-content">

            <div class="product-snapshot-card" id="secondaryProductSnapshotCard">
                <div class="product-snapshot-row product-snapshot-row--split">
                    <div class="product-snapshot-panel product-snapshot-panel-01">
                        <div class="product-snapshot-panel-header">
                            <span class="product-snapshot-panel-title-group">
                                <span class="product-snapshot-panel-title">Product Ranking</span>
                                <span class="section-loading-spinner" id="secondaryProductSnapshotRankingSpinner" aria-hidden="true"></span>
                            </span>
                            <div class="product-snapshot-panel-actions">
                                <div class="product-snapshot-qty-badge" id="secondaryProductSnapshotQtyBadge"></div>
                                <button type="button" class="product-snapshot-filter-toggle" id="secondaryProductSnapshotFilterToggleA" aria-expanded="false">
                                    <i class="bi bi-funnel"></i>
                                    <span>Filter</span>
                                    <i class="bi bi-chevron-down product-snapshot-filter-toggle-caret"></i>
                                </button>
                                <button type="button" class="product-snapshot-research-btn" id="secondaryProductResearchBtn">
                                    <i class="bi bi-search"></i>
                                    <span>Product Research</span>
                                </button>
                                <div class="product-snapshot-download-wrap">
                                    <button type="button" class="product-snapshot-download-btn" id="secondaryProductSnapshotRankingDownloadBtn" title="Download CSV" aria-expanded="false" data-feature="feature:excel-download">
                                        <i class="bi bi-download"></i>
                                    </button>
                                    <div class="product-snapshot-download-popup" id="secondaryProductSnapshotDownloadPopupA" hidden>
                                        <span class="product-snapshot-download-popup-title">Download Product Ranking</span>
                                        <select class="product-snapshot-download-range" id="secondaryProductSnapshotDownloadRangeA" title="Rows to download">
                                            <option value="current">Current Display (10)</option>
                                            <option value="range">Custom Range</option>
                                        </select>
                                        <input type="number" class="product-snapshot-download-range-input" id="secondaryProductSnapshotDownloadRangeInputA" min="1" step="1" placeholder="e.g. 30" title="How many rows to download" hidden>
                                        <button type="button" class="product-snapshot-download-confirm-btn" id="secondaryProductSnapshotDownloadConfirmA">
                                            <i class="bi bi-download"></i>
                                            <span>Download</span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="product-snapshot-panel-controls" id="secondaryProductSnapshotFilterBodyA" hidden>
                            <div class="product-snapshot-level-toggle" id="secondaryProductSnapshotLevelToggleA">
                                <button type="button" class="product-snapshot-level-btn active" data-level="product">Products</button>
                                <button type="button" class="product-snapshot-level-btn" data-level="category">Category</button>
                                <button type="button" class="product-snapshot-level-btn" data-level="subcategory">Sub-category</button>
                            </div>
                            <select class="product-snapshot-panel-filter" id="secondaryProductSnapshotPanelFilterA"></select>
                        </div>
                        <div class="product-snapshot-table-wrap scroll-hidden" id="secondaryProductSnapshotPanelBodyA"></div>
                    </div>
                </div>
            </div>
            </div>
            </div>

            <div class="product-research-modal-backdrop" id="secondaryProductResearchBackdrop" hidden>
                <div class="product-research-modal" role="dialog" aria-modal="true" aria-labelledby="secondaryProductResearchTitle">
                    <div class="product-research-modal-header">
                        <span id="secondaryProductResearchTitle">Product Research</span>
                        <div class="product-research-modal-header-actions">
                            <button type="button" class="product-snapshot-download-btn region-summary-download-btn" id="secondaryProductResearchDownloadBtn" title="Download CSV" data-feature="feature:excel-download">
                                <i class="bi bi-download"></i>
                            </button>
                            <button type="button" class="product-research-modal-close" id="secondaryProductResearchClose" aria-label="Close">&times;</button>
                        </div>
                    </div>
                    <div class="product-research-modal-body scroll-hidden">
                        <div class="product-snapshot-table-wrap scroll-hidden" id="secondaryProductResearchTableWrap"></div>
                    </div>
                </div>
            </div>

            <div class="section-container" id="reportsSectionContainer" data-permission="page:secondary-sales.reports" hidden>
            <div class="section-header">
            <p class="secondary-overview-subtitle">4. Reports</p>
            </div>

            <div class="section-content">
            <div class="reports-section-card" id="reportsSectionCard">
                <div class="reports-section-header">
                    <div class="brand-header-pill" id="reportsSectionTabToggle">
                        <button type="button" class="brand-header-item active" data-tab="all">All Report</button>
                        <button type="button" class="brand-header-item" data-tab="subchannel">Sub-Channel</button>
                        <button type="button" class="brand-header-item" data-tab="channel">Channel</button>
                        <button type="button" class="brand-header-item" data-tab="partner">Partner</button>
                    </div>

                    <span class="section-loading-spinner" id="reportsSectionSpinner" aria-hidden="true"></span>
                    <div class="reports-section-counts" id="reportsSectionCounts"></div>
                    <div class="product-snapshot-download-wrap">
                        <button type="button" class="product-snapshot-download-btn region-summary-download-btn" id="reportsSectionDownloadBtn" title="Download CSV" aria-expanded="false" data-feature="feature:excel-download">
                            <i class="bi bi-download"></i>
                        </button>
                        <div class="product-snapshot-download-popup" id="reportsSectionDownloadPopup" hidden>
                            <span class="product-snapshot-download-popup-title">Download Reports</span>
                            <select class="product-snapshot-download-range" id="reportsSectionDownloadScope" title="What to download">
                                <option value="active">Active Tab</option>
                                <option value="both">All Tabs (All Report + Sub-Channel + Channel + Partner)</option>
                            </select>
                            <button type="button" class="product-snapshot-download-confirm-btn" id="reportsSectionDownloadConfirm">
                                <i class="bi bi-download"></i>
                                <span>Download</span>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="product-snapshot-table-wrap" id="reportsSectionTableWrap"></div>
            </div>
            </div>
            </div>

            <div class="section-container" id="secondarySiteReportSectionContainer" data-permission="page:secondary-sales.site-master-report" hidden>
            <div class="section-header">
            <div class="secondary-overview-title-row">
                <p class="secondary-overview-subtitle">5. Site_Master Secondary_Sale Report</p>
                <div class="product-snapshot-download-wrap">
                    <button type="button" class="product-snapshot-download-btn region-summary-download-btn" id="secondarySiteReportDownloadBtn" title="Download CSV" data-feature="feature:excel-download">
                        <i class="bi bi-download"></i>
                    </button>
                </div>
            </div>
            </div>

            <div class="section-content">
            <div class="secondary-site-report-card" id="secondarySiteReportCard">
                <div class="reports-section-header">

                    <span class="section-loading-spinner" id="secondarySiteReportSpinner" aria-hidden="true"></span>
                </div>
                <div id="secondarySiteReportTableWrap"></div>
            </div>
            </div>
            </div>
            </section>

        </main>
    </div>

    <div class="quick-access-panel" id="quickAccessPanel"></div>

    <script type="module" src="/pages/SecondarySalesPage/SecondarySalesPage.js"></script>
</body>
</html>
