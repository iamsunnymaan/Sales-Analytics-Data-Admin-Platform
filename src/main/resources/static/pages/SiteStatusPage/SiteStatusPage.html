<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Site Insights - IB Department</title>
    <script src="/Shared/js/auth-guard.js"></script>
    <script src="/Shared/js/sidebar-collapse-init.js"></script>
    <script src="/Shared/js/theme-init.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/Shared/css/variables.css">
    <link rel="stylesheet" href="/Shared/css/app.css">
    <link rel="stylesheet" href="/Shared/css/card.css">
    <link rel="stylesheet" href="/components/Sidebar/Sidebar.css">
    <link rel="stylesheet" href="/components/QuickAccessPanel/QuickAccessPanel.css">
    <link rel="stylesheet" href="/components/ExcelDownloadButton/ExcelDownloadButton.css">
    <link rel="stylesheet" href="/components/StatusFilter/StatusFilter.css">
    <link rel="stylesheet" href="/components/FyYearFilter/FyYearFilter.css">
    <link rel="stylesheet" href="/pages/SiteStatusPage/SiteStatusPage.css">
</head>
<body>
    <div class="app-shell">
        <nav class="app-sidebar" id="appSidebar"></nav>
        <script src="/components/Sidebar/SidebarBootstrap.js"></script>
        <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
        <button type="button" class="sidebar-toggle-btn" id="sidebarToggle" aria-label="Open menu" aria-expanded="false" title="Menu">
            <i class="bi bi-list"></i>
        </button>

        <main class="app-main">
            <div class="site-status-top-row">
                <div class="site-status-card" id="siteStatusPickerCard" data-permission="page:site-insights.site-picker" hidden>

                    <div class="site-status-card-search-row">
                        <div class="site-status-search-wrap" data-feature="feature:search-bar">
                            <i class="bi bi-search"></i>
                            <input type="text" id="siteStatusSearchInput" placeholder="Code or store…" autocomplete="off">

                            <div class="site-status-search-results" id="siteStatusSearchResults" hidden></div>
                        </div>
                        <span class="site-status-card-count" id="siteStatusCodeCount"></span>
                    </div>

                    <div class="site-status-card-field">
                        <span class="site-status-card-label">Site Code</span>
                        <select class="site-status-card-select" id="siteStatusSiteCodeSelect">
                            <option value="">Loading…</option>
                        </select>
                    </div>

                    <div class="site-status-card-field" id="siteStatusBrandField" hidden>
                        <span class="site-status-card-label">Brand</span>
                        <select class="site-status-card-select" id="siteStatusBrandSelect"></select>
                    </div>

                    <div class="site-status-card-field site-status-filter-field">
                        <span class="site-status-card-label">Status</span>
                        <div class="site-status-filter-pill" id="siteStatusFilterToggle" data-feature="feature:status-filter">
                            <span class="site-status-filter-item brand-header-empty">Loading…</span>
                        </div>
                    </div>

                    <div class="site-status-card-field site-status-filter-field">
                        <span class="site-status-card-label">Sales Type</span>
                        <div class="site-status-filter-pill" id="siteStatusSalesTypeToggle" data-feature="feature:sales-type-filter">
                            <span class="site-status-filter-item brand-header-empty">Loading…</span>
                        </div>
                    </div>
                </div>

                <div class="site-status-action-btn-stack" data-permission="page:site-insights.geo-compare" hidden>

                    <button type="button" class="site-status-geo-map-toggle-card" id="siteStatusGeoMapToggleCard" title="View site coverage on the India map">
                        <i class="bi bi-geo-alt"></i>
                        <span>Geo Map</span>
                    </button>

                    <button type="button" class="site-status-geo-map-toggle-card" id="siteStatusCompareToggleCard" title="Compare states, sites, or hand-picked stores">
                        <i class="bi bi-bar-chart-line"></i>
                        <span>Compare</span>
                    </button>
                </div>

                <div class="site-status-context-row" id="siteStatusContextRow" hidden>
                    <div class="site-status-mini-map-card">
                        <div class="site-status-store-list-header">
                            <span class="site-status-card-label">Map</span>
                            <span class="site-status-store-list-header-right">
                                <span class="site-status-store-list-state-name" id="siteStatusMiniMapStateName"></span>
                                <span class="site-status-store-list-count" id="siteStatusMiniMapDistrictCount"></span>
                            </span>
                        </div>
                        <div class="site-status-mini-map-body" id="siteStatusMiniMapCard"></div>
                    </div>
                    <div class="site-status-store-list-card">
                        <div class="site-status-store-list-header">
                            <span class="site-status-card-label">Stores</span>
                            <span class="site-status-store-list-header-right">
                                <span class="site-status-store-list-state-name" id="siteStatusStoreListStateName"></span>
                                <span class="site-status-store-list-count" id="siteStatusStoreListCount"></span>
                            </span>
                        </div>
                        <div class="site-status-store-list-body" id="siteStatusStoreListBody"></div>
                    </div>
                </div>
            </div>

            <div id="siteDetailLoading" class="site-detail-loading" hidden>Loading site details…</div>
            <div id="siteDetailError" class="site-detail-error" hidden>Site not found.</div>
            <div id="siteDetailContent" data-permission="page:site-insights.site-detail" hidden></div>
        </main>
    </div>

    <div class="quick-access-panel" id="quickAccessPanel"></div>

    <div class="site-status-geo-map-modal-backdrop" id="siteStatusGeoMapModalBackdrop">
        <div class="site-status-geo-map-modal">
            <div class="site-status-geo-map-modal-header">
                <span class="site-status-geo-map-modal-title">Geo Map</span>
                <button type="button" class="site-status-geo-map-modal-close" id="siteStatusGeoMapModalClose" aria-label="Close">&times;</button>
            </div>
            <div class="site-status-geo-map-card" id="siteStatusGeoMapCard"></div>
        </div>
    </div>

    <div class="site-status-compare-modal-backdrop" id="siteStatusCompareModalBackdrop">
        <div class="site-status-compare-modal">
            <div class="site-status-geo-map-modal-header">
                <span class="site-status-geo-map-modal-title">Compare</span>
                <button type="button" class="site-status-geo-map-modal-close" id="siteStatusCompareModalClose" aria-label="Close">&times;</button>
            </div>

            <div class="site-status-compare-tabs" id="siteStatusCompareTabs">
                <button type="button" class="site-status-compare-tab-btn is-active" data-tab="states">States</button>
                <button type="button" class="site-status-compare-tab-btn" data-tab="sitesInState">Sites in a State</button>
                <button type="button" class="site-status-compare-tab-btn" data-tab="selectedStores">Selected Stores</button>
            </div>

            <div class="site-status-compare-panel" id="siteStatusComparePanel-states">
                <div class="site-status-compare-table-wrap" id="siteStatusCompareStatesWrap"></div>
            </div>

            <div class="site-status-compare-panel" id="siteStatusComparePanel-sitesInState" hidden>
                <div class="site-status-compare-controls">
                    <select class="site-status-card-select" id="siteStatusCompareStateSelect">
                        <option value="">Select a state…</option>
                    </select>
                </div>
                <div class="site-status-compare-table-wrap" id="siteStatusCompareSitesInStateWrap">
                    <div class="site-status-compare-table-empty">Pick a state above to compare its sites.</div>
                </div>
            </div>

            <div class="site-status-compare-panel" id="siteStatusComparePanel-selectedStores" hidden>
                <div class="site-status-compare-controls">
                    <input type="text" class="site-status-compare-search" id="siteStatusCompareStoreSearch" placeholder="Search stores by name, code, or city…" data-feature="feature:search-bar">
                    <button type="button" class="site-status-compare-run-btn" id="siteStatusCompareRunBtn" disabled>Compare Selected (<span id="siteStatusCompareSelectedCount">0</span>)</button>
                </div>
                <div class="site-status-compare-picker-list" id="siteStatusComparePickerList"></div>
                <div class="site-status-compare-table-wrap" id="siteStatusCompareSelectedStoresWrap">
                    <div class="site-status-compare-table-empty">Select stores above, then click Compare Selected.</div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/pages/SiteStatusPage/SiteStatusPage.js"></script>
</body>
</html>
