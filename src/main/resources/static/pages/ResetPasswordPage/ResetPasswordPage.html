<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Password - IB Department</title>
    <script src="/Shared/js/theme-init.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/Shared/css/variables.css">
    <link rel="stylesheet" href="/pages/LoginPage/LoginPage.css">
</head>
<body>
    <div class="login-shell">
        <div class="login-blob login-blob-a"></div>
        <div class="login-blob login-blob-b"></div>

        <div class="login-card">
            <div class="login-card-header">
                <div class="login-brand-row">
                    <span class="login-brand-icon"><i class="bi bi-hexagon-fill"></i></span>
                    <span class="login-brand-text">House of Beauty</span>
                </div>
            </div>

            <div class="login-welcome">
                <h1 class="login-welcome-title">Reset Your Password</h1>
                <p class="login-welcome-subtitle">Choose a new password for your account.</p>
            </div>

            <form id="resetPasswordForm" novalidate>
                <div class="login-form-error d-none" id="resetPasswordError" role="alert"></div>

                <div class="login-field" id="newPasswordGroup">
                    <label for="newPassword" class="login-label">New Password</label>
                    <div class="login-input-group">
                        <i class="bi bi-lock-fill login-input-icon"></i>
                        <input type="password" class="login-input" id="newPassword" name="newPassword" placeholder="Enter a new password" autocomplete="new-password">
                        <button type="button" class="login-input-suffix-btn" id="toggleNewPassword" aria-label="Show password" title="Show password">
                            <i class="bi bi-eye" id="toggleNewPasswordIcon"></i>
                        </button>
                    </div>
                    <div class="login-field-error" id="newPasswordError">Password must be at least 8 characters.</div>
                </div>

                <div class="login-field" id="confirmPasswordGroup">
                    <label for="confirmPassword" class="login-label">Confirm Password</label>
                    <div class="login-input-group">
                        <i class="bi bi-lock-fill login-input-icon"></i>
                        <input type="password" class="login-input" id="confirmPassword" name="confirmPassword" placeholder="Re-enter the new password" autocomplete="new-password">
                    </div>
                    <div class="login-field-error" id="confirmPasswordError">Passwords do not match.</div>
                </div>

                <button type="submit" class="login-submit-btn" id="resetSubmitBtn">
                    <span class="login-submit-label">Reset Password</span>
                    <span class="spinner-border spinner-border-sm login-submit-spinner d-none" id="resetSubmitSpinner" role="status" aria-hidden="true"></span>
                </button>
            </form>

            <div class="d-none" id="resetPasswordDone">
                <div class="login-form-success" id="resetPasswordDoneMessage">Your password has been reset. You can now log in.</div>
                <a class="login-submit-btn login-done-link" id="resetDoneLoginLink" href="/pages/LoginPage/LoginPage.html">
                    Go to Login
                </a>
            </div>
        </div>
    </div>

    <script src="/pages/ResetPasswordPage/ResetPasswordPage.js"></script>
</body>
</html>
